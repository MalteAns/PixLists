name: ComposeApp CI-Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: 'recursive'
          token: ${{ secrets.CI_PAT }}

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-overwrite-existing: true

#      - name: Verify aboutlibraries.json is up to date
#        run: |
#          ./gradlew :composeApp:exportLibraryDefinitions
#          git diff --exit-code -- composeApp/src/commonMain/resources/aboutlibraries.json || \
#            (echo "❌ aboutlibraries.json outdated. Run './gradlew :composeApp:exportLibraryDefinitions' locally and commit." && exit 1)

      - name: Build with Gradle
        run: ./gradlew clean :dataStore:build :legal:build :composeApp:build

#      - name: Run Unit Tests
#        run: ./gradlew test
